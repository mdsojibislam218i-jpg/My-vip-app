<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - VIP Gaming App</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Arial, sans-serif; }
        body { background: #0f172a; color: #fff; padding: 15px; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        h1 { font-size: 22px; color: #38bdf8; text-align: center; margin-bottom: 20px; }
        
        /* Stats Cards Layout */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .stat-card { background: #1e293b; padding: 15px; border-radius: 10px; border: 1px solid #334155; text-align: center; }
        .stat-card h3 { font-size: 13px; color: #94a3b8; margin-bottom: 5px; }
        .stat-card p { font-size: 20px; font-weight: bold; color: #38bdf8; }
        .stat-card.green p { color: #10b981; }
        .stat-card.orange p { color: #f59e0b; }

        .card { background: #1e293b; border-radius: 12px; padding: 15px; margin-bottom: 20px; border: 1px solid #334155; }
        .card-title { font-size: 15px; font-weight: bold; color: #f59e0b; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        
        input { width: 100%; padding: 10px; border-radius: 6px; border: 1px solid #475569; background: #0f172a; color: #fff; margin-bottom: 10px; font-size: 13px; }
        button { background: #2563eb; color: #fff; border: none; padding: 10px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        button.success { background: #10b981; }

        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { border: 1px solid #334155; padding: 10px; text-align: left; }
        th { background: #334155; color: #f8fafc; }

        .hidden { display: none !important; }
    </style>
</head>
<body>

<div class="container">

    <!-- Login Screen -->
    <div id="adminAuth" class="card" style="max-width: 400px; margin: 50px auto;">
        <div class="card-title">🔐 Admin Login</div>
        <input type="password" id="adminPass" placeholder="এডমিন পাসওয়ার্ড দিন">
        <button onclick="loginAdmin()" style="width: 100%;">প্রবেশ করুন</button>
    </div>

    <!-- Dashboard Content -->
    <div id="adminDashboard" class="hidden">
        <h1>⚙️ VIP Gaming Admin Dashboard</h1>

        <!-- Overview Dashboard Cards -->
        <div class="stats-grid">
            <div class="stat-card">
                <h3>👥 মোট ইউজার</h3>
                <p id="totalUsersCount">0</p>
            </div>
            <div class="stat-card orange">
                <h3>🆕 আজকের নতুন ইউজার</h3>
                <p id="todayUsersCount">0</p>
            </div>
            <div class="stat-card green">
                <h3>💰 মোট জমা (Deposit)</h3>
                <p id="totalDepositSum">৳ 0</p>
            </div>
            <div class="stat-card">
                <h3>💸 মোট উত্তোলন (Withdraw)</h3>
                <p id="totalWithdrawSum">৳ 0</p>
            </div>
        </div>

        <!-- Manual Balance Modify -->
        <div class="card">
            <div class="card-title">💵 ম্যানুয়ালি ব্যালেন্স যোগ/বিয়োগ করুন</div>
            <div style="display: flex; gap: 10px;">
                <input type="text" id="targetUserPhone" placeholder="ইউজারের মোবাইল নম্বর">
                <input type="number" id="targetAmount" placeholder="টাকার পরিমাণ (+ বা -)">
            </div>
            <button class="success" onclick="updateUserBalance()">ব্যালেন্স আপডেট করুন</button>
        </div>

        <!-- All Users List -->
        <div class="card">
            <div class="card-title">👥 নিবন্ধিত সকল ইউজারের তালিকা ও তথ্য</div>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>নাম</th>
                            <th>মোবাইল</th>
                            <th>বর্তমান ব্যালেন্স</th>
                            <th>মোট ডিপোজিট</th>
                            <th>উইথড্র নম্বর</th>
                            <th>রেজিস্ট্রেশনের তারিখ</th>
                        </tr>
                    </thead>
                    <tbody id="usersTableBody">
                        <!-- Dynamic content -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

</div>

<!-- Firebase SDKs -->
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyDlmi7Gs0G7MnOtQXBmpI8TxBs1CfjhlUo",
        authDomain: "g6bdwin.firebaseapp.com",
        databaseURL: "https://g6bdwin-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "g6bdwin",
        storageBucket: "g6bdwin.firebasestorage.app",
        messagingSenderId: "872964112407",
        appId: "1:872964112407:android:64a5e002b09872688a1c52"
    };

    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    const SECRET_ADMIN_PASS = "admin123";

    function loginAdmin() {
        let pass = document.getElementById('adminPass').value.trim();
        if (pass === SECRET_ADMIN_PASS) {
            document.getElementById('adminAuth').classList.add('hidden');
            document.getElementById('adminDashboard').classList.remove('hidden');
            loadDashboardData();
        } else {
            alert('❌ ভুল পাসওয়ার্ড!');
        }
    }

    function loadDashboardData() {
        database.ref('users').on('value', snapshot => {
            let users = snapshot.val();
            let tbody = document.getElementById('usersTableBody');
            tbody.innerHTML = '';

            if(!users) {
                tbody.innerHTML = '<tr><td colspan="6">কোনো ইউজার পাওয়া যায়নি</td></tr>';
                return;
            }

            let totalUsers = 0;
            let todayUsers = 0;
            let totalDeposit = 0;
            let totalWithdraw = 0;

            let todayDate = new Date().toLocaleDateString();

            for(let phone in users) {
                let u = users[phone];
                totalUsers++;

                // Date check for new users
                let userRegDate = u.joinedDate ? new Date(u.joinedDate).toLocaleDateString() : '';
                if(userRegDate === todayDate) {
                    todayUsers++;
                }

                // Balance & Deposit calculations
                let userDeposit = parseFloat(u.totalDeposit || 0);
                let userWithdraw = parseFloat(u.totalWithdraw || 0);
                totalDeposit += userDeposit;
                totalWithdraw += userWithdraw;

                let acc = u.withdrawAccount ? `${u.withdrawAccount.method}: ${u.withdrawAccount.number}` : 'নেই';
                let regDateFormatted = u.joinedDate ? new Date(u.joinedDate).toLocaleDateString('bn-BD') : 'অজানা';
                
                let tr = `<tr>
                    <td>${u.name || '-'}</td>
                    <td>${u.phone}</td>
                    <td>৳ ${parseFloat(u.balance || 0).toFixed(2)}</td>
                    <td>৳ ${userDeposit.toFixed(2)}</td>
                    <td>${acc}</td>
                    <td>${regDateFormatted}</td>
                </tr>`;
                tbody.innerHTML += tr;
            }

            // Update Header Stats
            document.getElementById('totalUsersCount').innerText = totalUsers;
            document.getElementById('todayUsersCount').innerText = todayUsers;
            document.getElementById('totalDepositSum').innerText = `৳ ${totalDeposit.toFixed(2)}`;
            document.getElementById('totalWithdrawSum').innerText = `৳ ${totalWithdraw.toFixed(2)}`;
        });
    }

    function updateUserBalance() {
        let phone = document.getElementById('targetUserPhone').value.trim();
        let amt = parseFloat(document.getElementById('targetAmount').value);

        if(!phone || isNaN(amt)) {
            alert('ইউজারের নম্বর ও সঠিক পরিমাণ লিখুন!');
            return;
        }

        database.ref('users/' + phone).once('value', snapshot => {
            if(snapshot.exists()) {
                let u = snapshot.val();
                u.balance = (u.balance || 0) + amt;
                
                // If adding balance manually, count it as deposit if positive
                if(amt > 0) {
                    u.totalDeposit = (u.totalDeposit || 0) + amt;
                }

                database.ref('users/' + phone).set(u);
                alert(`🎉 ${phone} নম্বরে ৳${amt} ব্যালেন্স আপডেট করা হয়েছে!`);
                document.getElementById('targetUserPhone').value = '';
                document.getElementById('targetAmount').value = '';
            } else {
                alert('❌ এই নম্বরের কোনো ইউজার পাওয়া যায়নি!');
            }
        });
    }
</script>

</body>
</html>
