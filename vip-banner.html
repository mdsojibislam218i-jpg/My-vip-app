<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MY VIP APP</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #120b03;
      min-height: 100%;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 12px;
      font-family: Arial, sans-serif;
    }
    .banner {
      width: min(100%, 1000px);
      overflow: hidden;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,.55);
      background: #1a0d03;
    }
    .banner img {
      display: block;
      width: 100%;
      height: auto;
    }
  </style>
</head>
<body>
  <main class="banner">
    <img src="https://i.ibb.co/tMTPsyjY/image.jpg" alt="MY VIP APP Banner">
  </main>
</body>
</html>
